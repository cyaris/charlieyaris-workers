name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manual-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual dispatcher
        run: |
          set -euo pipefail

          if [[ "$GITHUB_ACTOR" != "cyaris" ]]; then
            printf "Manual dispatch is restricted to cyaris.\n" >&2
            exit 1
          fi

  deploy:
    needs:
      - validate-manual-dispatch
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            printf "CLOUDFLARE_API_TOKEN secret is not configured.\n" >&2
            exit 1
          fi

          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            printf "CLOUDFLARE_ACCOUNT_ID repository variable is not configured.\n" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
